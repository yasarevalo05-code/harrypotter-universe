<section class="secretos">

  <h1>Secretos de Hogwarts</h1>

<div class="pergamino" [class.fade]="animando">

  <ng-container *ngIf="secretos[indice] as secreto">

    <img [src]="secreto.img" alt="Secreto">

    <div class="info">
      <h2>{{ secreto.titulo }}</h2>
      <p>{{ secreto.descripcion }}</p>
    </div>
  </ng-container>


</div>



  <div class="botones">
    <button (click)="anterior()">⟵</button>
    <button (click)="siguiente()">⟶</button>
  </div>

</section>
